name: 构建康鉴安卓 APK

# 全程只在 GitHub 云端的 ubuntu-latest 上装 Capacitor / JDK / Gradle，
# **不会在用户电脑上安装任何 Android 开发工具或 npm 依赖**。
# 产物是一个 debug 签名的 APK，用 actions/upload-artifact 传回来下载。

on:
  workflow_dispatch:
    inputs:
      version:
        description: '产物版本标记（仅用于日志显示）'
        required: false
        default: 'v1.0'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'vendor/**'
      - '*.png'
      - 'manifest.json'
      - 'sw.js'
      - 'capacitor.config.json'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JDK 21（Capacitor 7 要求 Java 21 编译）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 组装 www/（只放前端静态资源）
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p www/js
          cp index.html manifest.json sw.js www/
          cp -r css vendor www/
          cp ./*.png www/
          # js/ 下按需复制：config.local.js 及任何 *.local.* 一律排除。
          for f in js/*.js; do
            base="$(basename "$f")"
            case "$base" in
              config.local.js|*.local.js|*.local.*|*key*.js)
                echo "  [排除] 疑似密钥文件: $f" ;;
              *) cp "$f" www/js/ ;;
            esac
          done
          echo "--- www 文件清单 ---"
          find www -type f | sort
          echo "--- 密钥泄漏自检 ---"
          # 白名单：www/ 只允许前端静态资源。下面这些是 Node 源码 / 文档 / 服务端，
          # 一律不得进入 WebView 资产目录。用显式断言兜底，防止以后有人误加 cp。
          for forbidden in server dsh-plugin promo; do
            if [ -e "www/$forbidden" ]; then
              echo "!! www 里出现禁止目录: $forbidden/"; exit 1
            fi
          done
          if find www -type f \( -name 'config.local.js' -o -name 'key.local.txt' -o -name '*.local.*' -o -name '*.env*' \) | grep -q .; then
            echo "!! www 里出现密钥文件"; exit 1
          fi
          if grep -R -nE 'window\.HL_CONFIG[[:space:]]*=' www >/dev/null 2>&1; then
            echo "!! www 里出现本机密钥配置赋值"; exit 1
          fi
          if find www -type f -name '*.md' | grep -q .; then
            echo "!! www 里出现 .md"; exit 1
          fi
          echo "  OK：www 内无 server/、dsh-plugin/、promo/、无 .md、无密钥文件、无 HL_CONFIG 赋值"

      - name: 安装 Capacitor 7（只在云端）
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null
          npm i -D @capacitor/cli@7 @capacitor/core@7
          npm i @capacitor/android@7
          # v1.2：APK 专属的本地定时通知插件（必须在 cap add 之前装好，
          # 这样 cap add 内部的 sync 才会把它写进 capacitor.plugins.json）
          npm i @capacitor/local-notifications@7
          npx cap --version
          node -e "const c=require('./capacitor.config.json'); console.log('appId='+c.appId+' appName='+c.appName+' webDir='+c.webDir+' bundledWebRuntime='+String(c.bundledWebRuntime))"

      - name: 生成 Android 工程并同步 www
        shell: bash
        run: |
          set -euo pipefail
          npx cap add android
          npx cap copy android

      - name: 幂等补齐通知权限（POST_NOTIFICATIONS / 重启恢复）
        shell: bash
        run: |
          set -euo pipefail
          MF="android/app/src/main/AndroidManifest.xml"
          python3 - "$MF" <<'PY'
          import re
          import sys
          
          path = sys.argv[1]
          with open(path, "r", encoding="utf-8") as fh:
              text = fh.read()
          
          # Android 13+ (API 33) 的通知运行时权限；重启后由插件自带的
          # LocalNotificationRestoreReceiver 恢复已排期的通知。
          # 注意 Android 真实权限名是 RECEIVE_BOOT_COMPLETED（不是 RECEIVER_）。
          # 不申请 SCHEDULE_EXACT_ALARM / USE_EXACT_ALARM：通知走非精确调度，
          # 插件在不支持精确闹钟时自动退化为普通闹钟，避免特殊权限。
          perms = [
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.RECEIVE_BOOT_COMPLETED",
              "android.permission.WAKE_LOCK",
          ]
          missing = [p for p in perms if ('"%s"' % p) not in text]
          if missing:
              block = "\n" + "\n".join(
                  '    <uses-permission android:name="%s" />' % p for p in missing
              ) + "\n"
              m = re.search(r"<manifest\b[^>]*>", text)
              if not m:
                  raise SystemExit("!! 未找到 <manifest> 开标签: " + path)
              text = text[:m.end()] + block + text[m.end():]
              with open(path, "w", encoding="utf-8", newline="") as fh:
                  fh.write(text)
              print("  [补入] " + ", ".join(missing))
          else:
              print("  OK：三项权限已存在，无需改动")
          
          with open(path, "r", encoding="utf-8") as fh:
              final = fh.read()
          for p in perms:
              if ('"%s"' % p) not in final:
                  raise SystemExit("!! 权限仍缺失: " + p)
          print("  OK：POST_NOTIFICATIONS / RECEIVE_BOOT_COMPLETED / WAKE_LOCK 均在 Manifest 中")
          PY

      - name: 接受 Android SDK 许可 / 补齐平台
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          echo "ANDROID_HOME=$SDK"
          if [ -n "$SDK" ] && [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
            "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0" >/dev/null 2>&1 || true
          fi

      - name: 构建 debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 产物信息与 APK 内文件名自检
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          ls -lh "$APK"
          sha256sum "$APK"
          echo "--- APK 内 assets/public 文件（节选） ---"
          unzip -l "$APK" | grep -E 'assets/public/(js|css|vendor|index)' | head -n 20 || true
          if unzip -l "$APK" | grep -Ei 'key\.local|config\.local|\.env|server/'; then
            echo "!! APK 内出现密钥/服务端文件名"; exit 1
          fi
          echo "  OK：APK 内无密钥/服务端文件名"

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: healthlens-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
