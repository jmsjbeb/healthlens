<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A6E75">
<meta name="description" content="上传体检报告，分清真假异常，按星级排先后，给出就医、饮食、运动三份可执行方案。">
<title>康鉴 HealthLens · 体检报告解读与健康改善计划</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="康鉴">
<meta name="format-detection" content="telephone=no">
<link rel="stylesheet" href="css/app.css">
<!-- PWA 安装事件必须在「任何脚本之前」注册：Chrome 派发 beforeinstallprompt
     的时机不保证在 app.js 加载之后，晚了就永远收不到，用户看不到「一键安装」。
     这里只负责把事件存下来 + 给 <html> 挂 can-install 类（CSS 据此显示按钮），
     具体点击行为在 app.js 的 doInstall()。 -->
<script>
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    window.__HL_BIP = e;
    document.documentElement.classList.add('can-install');
  });
</script>
</head>
<body>

<div class="app" id="app">

  <!-- 顶栏 -->
  <header class="topbar">
    <div class="tb-row">
      <div class="brand">
        <div class="brand-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12h3l2-5 3 10 2.5-7 1.8 4H21"/>
          </svg>
        </div>
        <div class="brand-txt">
          <b>康鉴</b>
          <span>HealthLens</span>
        </div>
      </div>
      <button class="topbar-act" id="btnShare" style="display:none">分享</button>
      <button class="topbar-act" id="btnReset" style="display:none">重新上传</button>
      <button class="topbar-act topbar-ai" id="btnLlm" title="AI 影像解读设置" aria-label="AI 影像解读设置">AI</button>
    </div>
    <!-- 当前档案：只有家里有第二个人时才出现，单人用户不占这条 -->
    <button class="tb-who" id="tbWho" style="display:none" aria-haspopup="dialog"></button>
  </header>

  <!-- 视图 -->
  <main id="views">
    <section class="view on" id="view-intake"></section>
    <section class="view" id="view-overview"></section>
    <section class="view" id="view-care"></section>
    <section class="view" id="view-diet"></section>
    <section class="view" id="view-train"></section>
  </main>

  <!-- 底部 Tab -->
  <nav class="tabbar" id="tabbar">
    <button class="tab on" data-tab="overview">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13h4l2.5-7 3.5 13 3-9 1.5 3H21"/></svg>
      <span>总览</span>
    </button>
    <button class="tab" data-tab="care">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-4.5-7-10a4 4 0 017-2.6A4 4 0 0119 11c0 5.5-7 10-7 10z"/></svg>
      <span>就医</span>
    </button>
    <button class="tab" data-tab="diet">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3v8a2 2 0 002 2h0a2 2 0 002-2V3"/><path d="M7 13v8"/><path d="M17 3c-1.6 1.4-2.4 3.2-2.4 5.4 0 1.8.8 3 2.4 3.4V21"/></svg>
      <span>怎么吃</span>
    </button>
    <button class="tab" data-tab="train">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6M7 7v10M17 7v10M20 9v6M7 12h10"/></svg>
      <span>怎么运动</span>
    </button>
  </nav>

</div>

<!-- 扫描遮罩 -->
<div class="scan" id="scan">
  <div class="scan-inner">
    <div class="scan-doc">
      <div class="scan-line"></div>
      <div class="scan-bar"></div><div class="scan-bar"></div>
      <div class="scan-bar"></div><div class="scan-bar"></div>
    </div>
    <div class="scan-now" id="scanNow">正在读取报告…</div>
    <div class="scan-pct"><span id="scanPct">0</span><small>%</small></div>
    <div class="scan-track"><div class="scan-fill" id="scanFill"></div></div>
    <div class="scan-note" id="scanNote">正在识别检查项目与参考区间</div>
  </div>
</div>

<script src="js/tpl.js"></script>
<script src="js/data.js"></script>
<script src="js/dict.js"></script>
<script src="js/engine.js"></script>
<script src="js/ocr.js"></script>
<script src="js/pdf.js"></script>
<script src="js/share.js"></script>
<script src="js/trend.js"></script>
<script src="js/summary.js"></script>
<script src="js/img.js"></script>
<!-- 可选：本机开发用的配置文件，已被 .gitignore 排除，永远不会进 GitHub。
     只在 localhost / 127.0.0.1 / file:// 下加载——线上站点根本不会发这个请求，
     所以公开版控制台不会出现 404。公开版改读用户在「AI 设置」里自己填的密钥。 -->
<script>
  (function () {
    var h = location.hostname;
    if (h === 'localhost' || h === '127.0.0.1' || location.protocol === 'file:') {
      document.write('<script src="js/config.local.js"><\/script>');
    }
  })();
</script>
<script src="js/app.js"></script>
</body>
</html>
